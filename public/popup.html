<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SuperBook</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="terminal-container">
      <div class="terminal-header">
        <div class="terminal-dots">
          <div class="terminal-dot red"></div>
          <div class="terminal-dot yellow"></div>
          <div class="terminal-dot green"></div>
        </div>
        <div class="terminal-title"><strong>SuperBook</strong><span>Dictionary</span></div>
        <div class="header-actions">
          <button class="clear-btn" id="historyBtn" type="button">History</button>
          <button class="clear-btn" id="clearBtn" type="button">Clear</button>
        </div>
      </div>

      <div class="terminal-body">
        <div class="input-section">
          <span class="prompt" aria-hidden="true">⌕</span>
          <div class="input-container">
            <input
              type="text"
              class="word-input"
              id="wordInput"
              placeholder="Look up a word…"
              autocomplete="off"
              spellcheck="false" />
            <span class="cursor" id="cursor" aria-hidden="true"></span>
          </div>
        </div>

        <div class="output-section" id="output">
          <div class="output-line">
            <span class="welcome-title">Welcome to SuperBook</span>
          </div>
          <div class="output-line welcome-copy">
            Type a word and press Enter to get its definition, pronunciation,
            and synonyms.
          </div>
          <div class="output-line">&nbsp;</div>
        </div>

        <div class="help-text">
          Press Enter to search • ↑/↓ for history • ESC to clear input
        </div>

        <div class="status-indicator" id="statusIndicator">● online</div>
        <div class="ai-controls" aria-label="AI contextual meaning settings">
          <label class="switch-row" for="aiMode"><span><strong>Context mode</strong><small>Explain words in their surrounding text</small></span><input id="aiMode" type="checkbox" role="switch" /></label>
          <div class="ai-actions"><button id="configureAi" type="button">Configure key</button><button id="removeAiKey" type="button">Remove key</button></div>
          <div id="aiMessage" role="status" aria-live="polite"></div>
        </div>
        <dialog id="keyDialog">
          <form method="dialog" id="keyForm">
            <h2>Enable AI Mode</h2>
            <p>AI Mode uses Gemini to explain a selected word from its surrounding context.</p>
            <label for="geminiKey">Gemini API Key</label>
            <input id="geminiKey" type="password" autocomplete="off" required minlength="20" maxlength="256" />
            <div><button value="cancel" type="submit">Cancel</button><button id="saveKey" value="default" type="submit">Save &amp; Enable</button></div>
          </form>
        </dialog>
      </div>
    </div>

    <script src="popupp1.js"></script>
  </body>
</html>
